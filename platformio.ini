[platformio]
default_envs = xiao

; One firmware: photos go to the microSD card (FAT32) when one is in, else to internal flash.
; USB runs through TinyUSB (OTG) instead of the chip's built-in USB serial, so the card can appear as a USB drive.
[env:xiao]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_dtr = 1  ; TinyUSB only sends output once DTR and RTS are both on (and closing no longer resets the board)
monitor_rts = 1
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
; TinyUSB firmware restarts into flash mode when the port is opened at 1200 baud; then wait for the chip's own port
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0

; test build: never deep sleeps, serial 's' / 'l' / 'd' = short press / long press / USB drive
[env:test]
extends = env:xiao
build_flags =
    ${env:xiao.build_flags}
    -DFAKE_BTN
