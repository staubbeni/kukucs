<text x="70" y="400">cable: u.FL → right edge 5 mm, back to the lid face ≈5 mm, across the back 23 mm, up to the strip 2 mm</text>
<text x="70" y="422">≈ 34 mm to the strip, + ≈ 23 mm along the strip (photo) = ≈ 57 mm of the 80 mm cable: ≈ 23 mm of slack for an S-curve</text>
